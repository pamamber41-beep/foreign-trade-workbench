name: Enable Pages (one-shot)

on:
  push:
    paths:
      - '.github/workflows/enable-pages.yml'

permissions:
  pages: write
  contents: write
  administration: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check & enable Pages
        id: pages
        run: |
          set +e
          echo "=== Step 1: GET current Pages ==="
          get_code=$(curl -s -o /tmp/get.json -w "%{http_code}" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$GITHUB_REPOSITORY/pages)
          echo "GET HTTP $get_code"
          cat /tmp/get.json
          echo ""

          post_code="skip"
          if [ "$get_code" = "404" ]; then
            echo "=== Step 2: POST create Pages ==="
            post_code=$(curl -s -o /tmp/post.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/$GITHUB_REPOSITORY/pages \
              -d '{"source":{"branch":"main","path":"/"}}')
            echo "POST HTTP $post_code"
            cat /tmp/post.json
            echo ""
          fi

          echo "=== Step 3: final GET ==="
          sleep 3
          final_code=$(curl -s -o /tmp/final.json -w "%{http_code}" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$GITHUB_REPOSITORY/pages)
          echo "FINAL HTTP $final_code"
          cat /tmp/final.json

          # 把结果写进文件供外部读取
          {
            echo "# Pages enable result"
            echo "run_at: $(date -u +%FT%TZ)"
            echo "get_code: $get_code"
            echo "post_code: $post_code"
            echo "final_code: $final_code"
            echo ""
            echo "## final response"
            cat /tmp/final.json
          } > pages-result.md

      - name: Commit result
        run: |
          git config user.name "workflow-bot"
          git config user.email "bot@users.noreply.github.com"
          git add pages-result.md
          git commit -m "ci: record pages enable result" || true
          git push
